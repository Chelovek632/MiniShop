<div class="fade-in col-lg-8 offset-lg-2 col-md-10 offset-md-1">
    <h2 class="page-title text-center mb-4 text-dunder">👤 Профиль — Мои заказы</h2>
    <p class="text-center text-muted fst-italic mb-5">
        “Успешная продажа — это как шутка. Если ты должен её объяснять — она не работает.” — Dwight Schrute
    </p>

    <div id="profile-alert" class="alert d-none" role="alert"></div>

    <div id="orders-container">
        <!-- Спиннер загрузки -->
        <div id="orders-loading" class="text-center py-4">
            <div class="spinner-border text-dunder" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
        </div>

        <!-- Список заказов -->
        <div id="orders-list" class="accordion"></div>

        <!-- Пустой стейт -->
        <div id="orders-empty" class="text-center text-muted py-4 d-none">
            У вас пока нет заказов.<br>
            <span class="fst-italic">“Купи бумагу. Спаси офис.” — Jim Halpert</span>
        </div>
    </div>

    <div class="card shadow-sm border-0 mt-4">
        <div class="card-body">
            <h5 class="fw-bold text-dunder mb-3">🔑 Смена пароля</h5>
            <form id="changePasswordForm">
                <div class="mb-2">
                    <label class="form-label small" for="oldPassword">Текущий пароль</label>
                    <input type="password" class="form-control form-control-sm" id="oldPassword" autocomplete="current-password" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small" for="newPassword">Новый пароль (мин. 6 символов)</label>
                    <input type="password" class="form-control form-control-sm" id="newPassword" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small" for="confirmPassword">Повторите новый пароль</label>
                    <input type="password" class="form-control form-control-sm" id="confirmPassword" autocomplete="new-password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Сменить пароль</button>
            </form>
        </div>
    </div>
</div>
