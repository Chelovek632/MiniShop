<div class="fade-in col-md-6 offset-md-3">
    <h2 class="page-title text-center">Добавить продукт</h2>
    <form id="addProductForm" class="p-4 bg-white rounded shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="name">Название продукта:</label>
            <input type="text" class="form-control" id="name" name="product-name" placeholder="Введите название" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="price">Цена:</label>
            <input type="number" class="form-control" id="price" name="product-price" min="0" step="0.01" placeholder="Введите цену" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="quantity">Количество:</label>
            <input type="number" class="form-control" id="quantity" name="product-quantity" min="0" placeholder="Введите количество" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="imageurl">URL изображения:</label>
            <input type="text" class="form-control" id="imageurl" name="product-imageurl" placeholder="Введите URL изображения">
        </div>
        <div class="mb-3">
            <label class="form-label" for="imagefile">Или загрузите файл:</label>
            <input type="file" class="form-control" id="imagefile" name="product-imagefile" accept=".jpg,.jpeg,.png,.webp,.gif">
            <img id="image-preview" src="" alt="" class="img-thumbnail mt-2 d-none" style="max-height: 120px;">
        </div>
        <div class="mb-3">
            <label class="form-label" for="productCategory">Категория:</label>
            <select class="form-select" id="productCategory" name="product-category">
                <option value="">Без категории</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Добавить</button>
    </form>
</div>

<div class="fade-in col-md-6 offset-md-3 mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h5 class="fw-bold text-dunder mb-3">Категории</h5>
            <form id="createCategoryForm" class="mb-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="categoryName" placeholder="Название новой категории" maxlength="100" required>
                    <button class="btn btn-primary" type="submit">Создать</button>
                </div>
            </form>
            <ul id="category-list" class="list-group"></ul>
        </div>
    </div>
</div>

<div class="fade-in container-fluid px-4 mt-4">
    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="fw-bold text-dunder mb-3">Редактировать продукт</h5>
                    <form id="editProductForm">
                        <div class="mb-2">
                            <label class="form-label small">ID продукта</label>
                            <input type="number" class="form-control form-control-sm" id="editProductId" name="edit-product-id" min="1" placeholder="Введите ID продукта для редактирования" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Новое название</label>
                            <input type="text" class="form-control form-control-sm" id="editName" name="edit-product-name" placeholder="Оставьте пустым, чтобы не менять">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Новая цена</label>
                            <input type="number" class="form-control form-control-sm" id="editPrice" name="edit-product-price" min="0" step="0.01" placeholder="Оставьте пустым, чтобы не менять">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Новое количество</label>
                            <input type="number" class="form-control form-control-sm" id="editQuantity" name="edit-product-quantity" min="0" placeholder="Оставьте пустым, чтобы не менять">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Новый URL изображения</label>
                            <input type="text" class="form-control form-control-sm" id="editImageUrl" name="edit-product-imageurl" placeholder="Оставьте пустым, чтобы не менять">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-sm">Редактировать</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="fw-bold text-dunder mb-3">Удалить продукт</h5>
                    <form id="deleteProductForm">
                        <div class="mb-3">
                            <label class="form-label small">ID продукта</label>
                            <input type="number" class="form-control form-control-sm" id="productId" name="product-id" min="1" placeholder="Введите ID продукта для удаления" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 btn-sm">Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h5 class="fw-bold text-dunder mb-3">Изменить статус заказа</h5>
            <form id="updateOrderStatusForm" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small">ID заказа</label>
                    <input type="number" class="form-control form-control-sm" id="orderId" min="1" placeholder="Введите ID заказа" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Статус заказа</label>
                    <select class="form-select form-select-sm" id="orderStatus" required>
                        <option value="Pending">В обработке</option>
                        <option value="Paid">Оплачен</option>
                        <option value="Shipped">Отправлен</option>
                        <option value="Delivered">Доставлен</option>
                        <option value="Canceled">Отменён</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-warning w-100 btn-sm">Обновить статус</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h5 class="fw-bold text-dunder mb-3">Все заказы</h5>
            <div id="admin-orders-container"></div>
        </div>
    </div>
</div>
