name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MiniShop.sln -c Release

      - name: Test
        run: dotnet test MiniShop.Tests/MiniShop.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS syntax check
        run: |
          for f in MiniShop.Front/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done
